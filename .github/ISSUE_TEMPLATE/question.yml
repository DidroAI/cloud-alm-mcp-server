name: Question
description: How do I…? Does it support…?
labels: [question]
body:
  - type: markdown
    attributes:
      value: Never paste a service key, client secret or token. Redact tenant data you cannot share.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you are trying to do, and what you tried.
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: App and version
      description: e.g. Claude Desktop, Claude Code, Codex, Cursor, VS Code; and `npx -y cloud-alm-mcp-server --version`.
