name: Feature request
description: A tool, a field or a workflow you need.
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: The task
      description: What you were trying to do in Cloud ALM, in your own words (e.g. "prepare the fit-gap workshop for Order to Cash").
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: What was missing or hard
      description: Which tool calls you or the agent made, and where it got stuck.
  - type: textarea
    id: proposal
    attributes:
      label: Proposal (optional)
