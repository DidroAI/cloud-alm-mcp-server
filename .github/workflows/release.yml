name: Release

# Publishes to npm when a v* tag is pushed. Inert until the repository has
# an NPM_TOKEN secret: without it the publish job is skipped. Publishing is
# a maintainer decision; adding the secret is the switch.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Skip without NPM_TOKEN
        if: env.NPM_TOKEN == ''
        run: echo "::notice::NPM_TOKEN is not set; nothing published."
      - if: env.NPM_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.NPM_TOKEN != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - if: env.NPM_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - if: env.NPM_TOKEN != ''
        run: bun install --frozen-lockfile
      - name: Tag matches package.json version
        if: env.NPM_TOKEN != ''
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # prepublishOnly runs typecheck, tests and build again.
      # A prerelease version (0.1.0-beta.0) goes out under the beta tag.
      - if: env.NPM_TOKEN != ''
        run: |
          tag=latest
          case "$(node -p 'require("./package.json").version')" in *-*) tag=beta ;; esac
          npm publish --provenance --access public --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Until a release exists, latest follows the newest beta, so a bare
      # `npx cloud-alm-mcp-server` gets it.
      - name: Point latest at the beta while there is no release
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          latest="$(npm view cloud-alm-mcp-server dist-tags.latest 2>/dev/null || true)"
          case "$version" in *-*)
            case "$latest" in ""|*-*) npm dist-tag add "cloud-alm-mcp-server@$version" latest ;; esac ;;
          esac
