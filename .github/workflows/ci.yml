name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    name: check (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      # The hosted connector: its report inbox, and sign-in end to end, against this commit's own build
      # (scripts/link-hosted.mjs points the package name at it), as the docs site bundles it.
      - run: npm ci --prefix hosted --ignore-scripts --no-audit --no-fund
      - run: bun run test:hosted
      # The built server starts on plain Node and answers 401 without a token.
      - name: Smoke test on Node
        run: |
          node dist/cli.js http &
          sleep 1
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3333/mcp -H 'content-type: application/json' -d '{}')
          test "$code" = "401"
      # The packed tarball installs and its command runs on plain Node.
      - name: Pack and run the installed command
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/cloud-alm-mcp-server-*.tgz
          npx --no-install cloud-alm-mcp-server --version
          if CALM_CONFIG_DIR="$RUNNER_TEMP/empty" npx --no-install cloud-alm-mcp-server doctor; then exit 1; fi
      # The Claude Desktop extension packs and its server loads: found here, not at release time.
      - name: Build the .mcpb
        if: matrix.node == 24
        run: scripts/build-mcpb.sh "$RUNNER_TEMP/check.mcpb"
