name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste a service key, client secret or token. Redact tenant data you cannot share.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead. Include the tool call and its answer if you have them.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `npx -y cloud-alm-mcp-server --version`. For the hosted connector, write "hosted".
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      options: [Claude Desktop, Claude Code, Claude (web), Codex, Cursor, VS Code, ChatGPT, Other]
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - stdio (service key)
        - HTTP (bearer token)
        - Hosted connector (ChatGPT or Claude in the browser)
  - type: textarea
    id: doctor
    attributes:
      label: Output of `cloud-alm-mcp-server doctor`
      description: It prints no secrets. Leave empty for the hosted connector.
      render: text
