name: Release

# Publishes to npm when a v* tag on main is pushed, through npm trusted
# publishing (OIDC) for this workflow, with provenance.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  # Trusted publishing (OIDC): npm trusts this workflow, no token needed.
  # NPM_TOKEN, if still set, is the fallback until trusted publishing is on.
  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      # Checked by the check job; no scripts run with the token.
      # A prerelease version (0.1.0-beta.0) goes out under the beta tag.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tag=latest
          case "$(node -p 'require("./package.json").version')" in *-*) tag=beta ;; esac
          npm publish --provenance --access public --tag "$tag" --ignore-scripts
      # Until a release exists, latest follows the newest beta, so a bare
      # `npx cloud-alm-mcp-server` gets it.
      - name: Point latest at the beta while there is no release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Trusted publishing covers publish only; moving a tag needs a token.
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::notice::no NPM_TOKEN: latest not moved"; exit 0; fi
          version="$(node -p 'require("./package.json").version')"
          latest="$(npm view cloud-alm-mcp-server dist-tags.latest 2>/dev/null || true)"
          case "$version" in *-*)
            case "$latest" in ""|*-*) npm dist-tag add "cloud-alm-mcp-server@$version" latest ;; esac ;;
          esac
